server:
  port: 8081

spring:
  application:
    name: xy

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/xydb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    password: 123456

  data:
    redis:
      host: 192.168.222.128
      port: 6379
      password: 123456
      timeout: 5000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    # 数据库下划线字段 -> Java 驼峰属性，自动映射
    map-underscore-to-camel-case: true
    # 把执行的 SQL 打到控制台，调接口时看得见
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：跟随数据库的 AUTO_INCREMENT
      id-type: auto
